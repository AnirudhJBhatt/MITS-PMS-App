name: Build and Release Mobile App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-app:
    name: Deploy Mobile App
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Detect if native configuration files changed
      - name: Path Filter (Detect Native Changes)
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'app.json'
              - 'package.json'
              - 'package-lock.json'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # FLOW A: Publish Over-The-Air (OTA) Update for JS-only changes
      - name: Publish EAS Update (OTA)
        if: steps.filter.outputs.native == 'false' && github.event_name != 'workflow_dispatch'
        run: |
          eas update --branch production --message "${{ github.event.head_commit.message }}"

      # FLOW B: Build new APK and publish to GitHub Releases for Native Changes
      - name: Get App Version
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "App version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Android APK
        if: steps.filter.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          eas build --platform android --profile production --non-interactive

      - name: Get Build Artifact
        if: steps.filter.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
        id: get_artifact
        run: |
          BUILD_URL=$(eas build:list --platform android --status finished --limit 1 --json | jq -r '.[0].artifacts.buildUrl')
          curl -L -o mits-pms-app.apk "$BUILD_URL"
          echo "artifact_path=mits-pms-app.apk" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.filter.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: mits-pms-app.apk

          name: MITS PMS v${{ steps.version.outputs.version }}

          tag_name: v${{ steps.version.outputs.version }}

          body: |
            MITS PMS Android App

            Version: ${{ steps.version.outputs.version }}
            Build ID: ${{ steps.build.outputs.build_id }}

          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
